name: Update leaderboard

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/data.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live data and recompute scores
        run: python scripts/update.py

      - name: Commit refreshed data
        run: |
          git config user.name "wolfson-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Refresh leaderboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Two runs can race (a push-triggered run and a scheduled or manual one).
          # Rebase onto whatever landed first and retry rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing and retrying..."
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push refreshed data after 3 attempts."
          exit 1

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
